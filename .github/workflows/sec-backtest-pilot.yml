name: SEC backtest pilot

# Manual run of the SEC-only $100,000 backtest pilot (decision date
# 2024-09-03). The result is PIPELINE VALIDATION, not evidence of investment
# performance. It reads published SEC facts through the shared valuation-input
# loader with source=sec (no Yahoo statement fallback). Its only database write
# is one append-only row in the private backtest_price_snapshots table: the
# exact prices this run read, stored before an offline replay from that stored
# copy must reproduce the run exactly, plus one append-only row holding the
# full record (including the Yahoo-derived daily curves) in the private
# backtest_pilot_private_records table. This repository is public: the stored
# price series and the daily curves are never printed or uploaded. The log does
# print the reduced public record, which includes each issuer's decision-date
# closing price, beta, and RSI and each cost case's summary statistics (ending
# value, returns, drawdown, volatility), plus the checksums of the private
# snapshot and full record.
#
# Archive mode (all three replay_* inputs): rebuild an earlier pinned run's
# full record offline from its stored snapshot and recorded data-vintage
# cutoff, and store it privately. No live prices are fetched.
"on":
  workflow_dispatch:
    inputs:
      prior_run_ids:
        description: "Earlier provisional pilot run IDs to cite, space-separated"
        required: false
        default: "35809011675"
        type: string
      replay_snapshot_sha256:
        description: "Archive mode: stored price snapshot SHA-256"
        required: false
        default: ""
        type: string
      replay_data_vintage_cutoff:
        description: "Archive mode: the run's recorded data_vintage_cutoff (UTC ISO)"
        required: false
        default: ""
        type: string
      replay_of_run:
        description: "Archive mode: the pinned run whose record is rebuilt"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sec-backtest-pilot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run pilot, loader, and SEC fundamentals tests
        run: >
          python -m pytest -q tests/backtesting/test_sec_pilot.py
          tests/test_valuation_input.py tests/fundamentals tests/test_ci_config.py

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the SEC-only pilot with pinned prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRIOR_RUN_IDS: ${{ inputs.prior_run_ids }}
          REPLAY_SNAPSHOT: ${{ inputs.replay_snapshot_sha256 }}
          REPLAY_CUTOFF: ${{ inputs.replay_data_vintage_cutoff }}
          REPLAY_OF_RUN: ${{ inputs.replay_of_run }}
        run: |
          prior_args=()
          for run_id in ${PRIOR_RUN_IDS}; do
            [[ "${run_id}" =~ ^[0-9]+$ ]] || { echo "Run IDs must be numeric." >&2; exit 1; }
            prior_args+=(--prior-run-id "${run_id}")
          done
          replay_args=()
          if [[ -n "${REPLAY_SNAPSHOT}${REPLAY_CUTOFF}${REPLAY_OF_RUN}" ]]; then
            [[ "${REPLAY_SNAPSHOT}" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid snapshot SHA-256." >&2; exit 1; }
            [[ "${REPLAY_CUTOFF}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+\+00:00$ ]] || { echo "Invalid cutoff." >&2; exit 1; }
            [[ "${REPLAY_OF_RUN}" =~ ^[0-9]+$ ]] || { echo "Invalid run ID." >&2; exit 1; }
            replay_args=(--replay-snapshot "${REPLAY_SNAPSHOT}" --replay-data-vintage-cutoff "${REPLAY_CUTOFF}" --replay-of-run "${REPLAY_OF_RUN}")
          fi
          python -m src.backtesting.sec_pilot --output sec-pilot-2024-09-03.json \
            --github-run-id "${GITHUB_RUN_ID}" "${prior_args[@]}" "${replay_args[@]}"
          # Reduced public record only: no price series or daily curves, but it
          # does include decision-date prices and summary statistics.
          echo "----- BEGIN SEC PILOT RECORD -----"
          cat sec-pilot-2024-09-03.json
          echo "----- END SEC PILOT RECORD -----"
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          report = json.load(open("sec-pilot-2024-09-03.json"))
          print("## SEC backtest pilot — pipeline validation\n")
          print(f"> {report['disclaimer']}\n")
          print(f"Decision {report['decision_date']} (cutoff {report['knowledge_cutoff']}); "
                f"entry {report['entry_date']} open, exit {report['exit_date']} close; "
                f"strategy outcome: {report['strategy_outcome']}\n")
          print("| Cost (bps) | Curve | Net return | vs SPY | Max drawdown | Cash |")
          print("|---|---|---|---|---|---|")
          for cost, curves in report["cost_cases"].items():
              for name, curve in curves.items():
                  print(f"| {cost} | {name} | {curve['net_return']:.2%} | "
                        f"{curve['excess_return_vs_benchmark']:.2%} | {curve['max_drawdown']:.2%} | "
                        f"{curve['unallocated_cash_fraction']:.0%} |")
          snap = report["price_snapshot"]
          print(f"\nPrice snapshot `{snap['sha256']}` ({snap['adjusted_rows']} adjusted rows, "
                f"{', '.join(snap['symbols'])}); offline replay identical: {snap['offline_replay_identical']}. "
                f"Prior provisional runs: {', '.join(report['audit_trail']['prior_provisional_run_ids']) or 'none'}.")
          print("\n**Rejected issuers:**")
          for item in report["rejected_issuers"] or [{"ticker": "none", "reason": "", "unallocated_capital_fraction": 0}]:
              print(f"- {item['ticker']}: {item['reason']} (unallocated {item['unallocated_capital_fraction']:.0%})")
          PY
