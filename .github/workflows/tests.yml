name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same Python version as .github/workflows/rebalance.yml (the
      # scheduled live-execution workflow) — dependency resolution and
      # test behavior should be verified against the version that
      # actually runs in production, not whatever's on a contributor's
      # machine.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Pyflakes
        run: pyflakes src tests

      # No `.env` exists in CI and none of the secrets rebalance.yml uses
      # are provided here on purpose — this workflow must never be able
      # to reach a real Postgres/Alpaca/Redis/yfinance endpoint.
      # tests/conftest.py's isolation fixtures (poisoned credentials,
      # blocked sockets, blocked psycopg2/TradingClient/yfinance
      # construction) are the actual enforcement; running with no
      # secrets configured is defense in depth on top of that, not a
      # substitute for it.
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # This job intentionally references no repository secret context
    # anywhere — tests, type-checking, lint, and the production build
    # all run against example/no configuration, contacting no real
    # Alpaca/Postgres/Redis endpoint. That's defense in depth on top of
    # (not a substitute for) GitHub's own platform behavior: a
    # `pull_request` (as opposed to `pull_request_target`) trigger from
    # a FORKED repository already never receives repository secrets at
    # all, precisely so a forked-repo PR can't exfiltrate them via a
    # modified workflow run.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # frontend/src/lib/*.test.ts run as plain `.ts` files via Node's
      # native TypeScript type-stripping (stable/default since Node
      # 23.6, no `--experimental-strip-types` flag or ts-node/tsx
      # dependency needed) — see frontend/package.json's "engines" field
      # for the same minimum version requirement.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security/unit tests
        run: npm run test:security

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
