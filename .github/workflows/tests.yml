name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valuation_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valuation_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same Python version as .github/workflows/rebalance.yml (the
      # scheduled live-execution workflow) — dependency resolution and
      # test behavior should be verified against the version that
      # actually runs in production, not whatever's on a contributor's
      # machine.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Record numerical environment
        run: |
          python - <<'PY'
          import platform, sys
          import numpy, pandas, scipy
          print("platform", platform.platform(), platform.machine())
          print("python", sys.version.split()[0], "numpy", numpy.__version__, "pandas", pandas.__version__, "scipy", scipy.__version__)
          PY

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Pyflakes
        run: pyflakes src tests

      # No `.env` exists in CI and none of the secrets rebalance.yml uses
      # are provided here on purpose — this workflow must never be able
      # to reach a real Postgres/Alpaca/Redis/yfinance endpoint.
      # tests/conftest.py's isolation fixtures (poisoned credentials,
      # blocked sockets, blocked psycopg2/TradingClient/yfinance
      # construction) are the actual enforcement; running with no
      # secrets configured is defense in depth on top of that, not a
      # substitute for it.
      - name: Run tests
        run: python -m pytest -q

      # This is the suite's sole network exception: a synthetic database
      # inside this CI runner, named and addressed explicitly. The normal
      # full-suite step above still runs with every socket blocked.
      - name: PostgreSQL fundamentals integration
        env:
          ALLOW_TEST_POSTGRES: '1'
          FUNDAMENTALS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/valuation_engine_test
        run: >
          python -m pytest -q tests/fundamentals/test_store_postgres.py
          tests/fundamentals/test_incremental_publication_postgres.py
          tests/fundamentals/test_segment_publication_command.py

  # The Vercel backend installs pyproject.toml (Python 3.12, numpy 2.0.2, pandas 2.3.3, yfinance 1.2.0), not
  # requirements.txt (this repository's CI and local versions). The two sets are different on purpose, so the
  # Monte Carlo tests and the manifest contract tests also run under exactly the deployed pins. Test-only
  # packages (pytest, httpx for the API test client, and what tests/conftest.py imports) are added on top
  # without being allowed to move the pinned numerical libraries; the step fails if they move.
  pytest-deployed-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the deployed dependency set plus test-only packages
        run: |
          python - <<'PY' > deployed-requirements.txt
          import tomllib
          print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]))
          PY
          pip install -r deployed-requirements.txt alpaca-py==0.44.0 "uvicorn[standard]==0.52.4" pytest==8.3.3 httpx
          python - <<'PY'
          import numpy, pandas, platform, scipy, sys
          print("platform", platform.platform(), platform.machine())
          print("python", sys.version.split()[0], "numpy", numpy.__version__, "pandas", pandas.__version__, "scipy", scipy.__version__)
          assert numpy.__version__ == "2.0.2" and pandas.__version__ == "2.3.3", "test-only packages moved the deployed pins"
          PY

      - name: Monte Carlo and manifest tests under the deployed pins
        run: >
          python -m pytest -q tests/dcf/test_monte_carlo*.py tests/api/test_monte_carlo_api.py
          tests/test_vercel_config.py tests/test_pyproject_config.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # This job intentionally references no repository secret context
    # anywhere — tests, type-checking, lint, and the production build
    # all run against example/no configuration, contacting no real
    # Alpaca/Postgres/Redis endpoint. That's defense in depth on top of
    # (not a substitute for) GitHub's own platform behavior: a
    # `pull_request` (as opposed to `pull_request_target`) trigger from
    # a FORKED repository already never receives repository secrets at
    # all, precisely so a forked-repo PR can't exfiltrate them via a
    # modified workflow run.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # frontend/src/lib/*.test.ts run as plain `.ts` files via Node's
      # native TypeScript type-stripping (stable/default since Node
      # 23.6, no `--experimental-strip-types` flag or ts-node/tsx
      # dependency needed) — see frontend/package.json's "engines" field
      # for the same minimum version requirement.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security/unit tests
        run: npm run test:security

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
