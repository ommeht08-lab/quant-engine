name: Daily Portfolio Rebalance

# The weekday schedule runs on GitHub's infrastructure, so the paper
# strategy does not depend on a laptop being awake. 17:15 UTC is during
# regular US market hours in both EDT (13:15) and EST (12:15), including
# enough room before a standard 13:00 early close for the scan to finish.
# Every individual order still rechecks Alpaca's market clock immediately
# before submission and fails safe if the market is closed.
"on":
  schedule:
    - cron: "15 17 * * 1-5"
  workflow_dispatch:
    inputs:
      execute:
        description: >-
          Leave as "dry-run" (the default) to scan and print every order
          that WOULD be placed, without submitting anything. Select
          "execute" to actually submit real (paper-only — see
          PAPER_TRADING_HOSTNAME in src/trading/alpaca_execution.py,
          which this workflow cannot override) orders immediately. This
          input controls manual runs; weekday schedules execute the same
          paper-only strategy automatically.
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute

permissions:
  contents: read

# Only one rebalance run (of any trigger) may be in flight at a time.
# Without this, two overlapping scheduled/manual runs could each independently
# liquidate/rebalance/hedge against the same account concurrently — the
# in-process duplicate-order guards (`_open_order_symbols`/
# `_is_duplicate_submission` in src/trading/alpaca_execution.py) only
# protect within a single run, not across two runs racing each other.
# `cancel-in-progress: false` — never cancel a run that may already be
# mid-way through submitting real orders; a new run simply waits for the
# current one to finish instead.
concurrency:
  group: rebalance
  cancel-in-progress: false

jobs:
  # Runs the isolation-safe test suite with NO production secrets
  # available to it — the same fixtures in tests/conftest.py that
  # poison credentials and block real Postgres/Alpaca/Redis/yfinance
  # access apply here too, but the absence of secrets.* in this job's
  # env is defense in depth on top of that, not a substitute for it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Pyflakes
        run: pyflakes src tests

      - name: Run isolation-safe test suite
        run: python -m pytest -q

  # Only runs if `test` succeeds — a failing/broken test suite (e.g. a
  # reverted isolation fixture, a regressed safety check) must never let
  # this job execute against the real paper-trading account.
  execute_trades:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled rebalance or requested manual mode
        env:
          # Needed in EVERY mode: even a dry run reads the real (paper
          # -only) account/positions to show what it WOULD do — see
          # `main()`'s use of `trading_client.get_account()` in
          # src/trading/alpaca_execution.py, which runs regardless of
          # --dry-run.
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
          # Every mode records append-only operational run health. Manual
          # dry runs still submit zero orders and write no trade rows, but
          # do append started/completed/failed health events for the dashboard.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ (github.event_name == 'schedule' || github.event.inputs.execute == 'execute') && secrets.UPSTASH_REDIS_REST_URL || '' }}
          UPSTASH_REDIS_REST_TOKEN: ${{ (github.event_name == 'schedule' || github.event.inputs.execute == 'execute') && secrets.UPSTASH_REDIS_REST_TOKEN || '' }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.execute }}" = "execute" ]; then
            python -m src.trading.alpaca_execution 2>&1 | tee rebalance-report.txt
          else
            python -m src.trading.alpaca_execution --dry-run 2>&1 | tee rebalance-report.txt
          fi
          grep -q '^ALPACA_PIPELINE_COMPLETED ' rebalance-report.txt
